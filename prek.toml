# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
hooks = [
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "check-added-large-files" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-xml" },
  { id = "check-toml" },
]
repo = "builtin"


[[repos]]
hooks = [
  { id = "ruff", args = [
    "--fix",
    "--unsafe-fixes",
  ] },
  { id = "ruff-format" },
]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.9"

[[repos]]
hooks = [
  { id = "basedpyright" },
  # The errors that were already there live in .basedpyright/baseline.json, so
  # the hook above only reports what we newly break. Fixing some of them shrinks
  # the baseline by itself -- basedpyright rewrites the file when the count goes
  # down, which shows up as "files were modified by this hook"; commit it and
  # move on. Absorbing errors is the deliberate step, and only this hook does it:
  #
  #   prek run --hook-stage manual basedpyright-baseline
  #
  # Reach for it when a batch has to wait, not to silence one you just wrote.
  { id = "basedpyright", alias = "basedpyright-baseline", name = "basedpyright (rewrite baseline)", args = [
    "--writebaseline",
  ], pass_filenames = false, stages = [
    "manual",
  ] },
]
repo = "https://github.com/DetachHead/basedpyright-prek-mirror"
rev = "1.40.1"

[[repos]]
repo = "https://github.com/google/keep-sorted"
rev = "v0.10.0"
hooks = [{ id = "keep-sorted" }]
