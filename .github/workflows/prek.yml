name: Prek

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      # Optional binary cache; drop this step if you don't use cachix.
      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      # Run inside devenv so uv has synced .venv (needed by basedpyright).
      - name: Run prek
        run: devenv shell -- prek run --all-files --show-diff-on-failure
