[pytest]
addopts = --strict-markers

; `@pytest.mark.flaky(reruns=...)` (pytest-rerunfailures) marks the browser
; tests that lose a click to an htmx swap now and then. Hunt for more with
; pytest-flakefinder:
;   pytest --flake-finder --flake-runs=5

; timeout_method = thread
timeout = 60

testpaths = src/menage2

filterwarnings =
    ignore::DeprecationWarning
